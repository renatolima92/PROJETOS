<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilização da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .site {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .site h2 {
            font-size: 20px;
            color: #333;
        }

        .site img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 10px;
        }

        .site a {
            display: block;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .site a:hover {
            color: #ff6600;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal da página -->
    <h1>Meus sites favoritos: Renato Lima</h1>

    <div class="container">

        <!-- Instagram -->
        <div class="site">
            <h2>Instagram</h2>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128"
                     alt="Logo do Instagram">
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                Acessar Instagram
            </a>
        </div>

        <!-- YouTube -->
        <div class="site">
            <h2>YouTube</h2>
            <a href="https://www.youtube.com/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
                     alt="Logo do YouTube">
            </a>
            <a href="https://www.youtube.com/" target="_blank">
                Acessar YouTube
            </a>
        </div>

        <!-- Netflix -->
        <div class="site">
            <h2>Netflix</h2>
            <a href="https://www.netflix.com/br/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=netflix.com&sz=128"
                     alt="Logo da Netflix">
            </a>
            <a href="https://www.netflix.com/br/" target="_blank">
                Acessar Netflix
            </a>
        </div>

        <!-- SoundCloud -->
        <div class="site">
            <h2>SoundCloud</h2>
            <a href="https://soundcloud.com/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=soundcloud.com&sz=128"
                     alt="Logo do SoundCloud">
            </a>
            <a href="https://soundcloud.com/" target="_blank">
                Acessar SoundCloud
            </a>
        </div>

        <!-- Wyden -->
        <div class="site">
            <h2>Estudante Wyden</h2>
            <a href="https://estudante.wyden.com.br/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=wyden.com.br&sz=128"
                     alt="Logo da Wyden">
            </a>
            <a href="https://estudante.wyden.com.br/" target="_blank">
                Acessar Wyden
            </a>
        </div>

        <!-- Santander Open Academy -->
        <div class="site">
            <h2>Santander Open Academy</h2>
            <a href="https://www.santanderopenacademy.com/" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=santanderopenacademy.com&sz=128"
                     alt="Logo do Santander Open Academy">
            </a>
            <a href="https://www.santanderopenacademy.com/" target="_blank">
                Acessar Santander Open Academy
            </a>
        </div>

    </div>

</body>
</html>
